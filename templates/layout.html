<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Analisis Sentimen{% endblock %}</title>
    <!-- Memuat Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Navbar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                         <i class="fas fa-robot text-indigo-600 fa-2x"></i>
                    </div>
                    <div class="hidden md:block">
                        <div class="ml-10 flex items-baseline space-x-4">
                            <!-- Link Navigasi -->
                            <a href="{{ url_for('upload_file') }}" class="px-3 py-2 rounded-md text-sm font-medium {% if request.path == '/' %} text-white bg-indigo-600 {% else %} text-gray-700 hover:bg-gray-200 {% endif %}">
                                <i class="fas fa-upload mr-1"></i> Unggah File
                            </a>
                            <a href="{{ url_for('list_files') }}" class="px-3 py-2 rounded-md text-sm font-medium {% if request.path == '/files' %} text-white bg-indigo-600 {% else %} text-gray-700 hover:bg-gray-200 {% endif %}">
                               <i class="fas fa-folder-open mr-1"></i> Lihat File Tersimpan
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Konten Halaman -->
    <main class="py-10">
        <div class="max-w-7xl mx-auto sm:px-6 lg:px-8">
            {% block content %}{% endblock %}
        </div>
    </main>

</body>
</html>
