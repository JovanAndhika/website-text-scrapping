{% extends "layout.html" %}

{% block title %}Hasil Pembersihan Data{% endblock %}

{% block content %}
<style>
    /* Style untuk tabel yang dihasilkan pandas */
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
    thead th { background-color: #f8f9fa; font-weight: bold; color: #495057; }
    tbody tr:hover { background-color: #f1f1f1; }
</style>
<div class="w-full max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-lg">
    <div class="text-center mb-6">
        <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100">
            <i class="fas fa-check fa-lg text-green-600"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mt-4">File Berhasil Diproses!</h1>
        <p class="text-gray-500 mt-2">File <code class="bg-gray-200 text-sm p-1 rounded">{{ filename }}</code> telah berhasil dibersihkan dan disimpan di folder <code class="bg-gray-200 text-sm p-1 rounded">uploads</code>.</p>
    </div>

    <div class="mt-8">
        <h3 class="text-lg font-semibold text-gray-700 mb-4">Pratinjau 5 Baris Pertama Data Bersih:</h3>
        <div class="overflow-x-auto rounded-lg border">
            {{ table|safe }}
        </div>
    </div>
</div>
{% endblock %}
